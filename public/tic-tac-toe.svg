<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080608" />
      <stop offset="100%" stop-color="#170f2f" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" rx="40" fill="url(#bg)" />
  <g filter="url(#glow)" stroke="#7c3aed" stroke-width="24" stroke-linecap="round">
    <line x1="260" y1="120" x2="260" y2="480" />
    <line x1="540" y1="120" x2="540" y2="480" />
    <line x1="120" y1="220" x2="680" y2="220" />
    <line x1="120" y1="340" x2="680" y2="340" />
  </g>
  <g stroke="#f8fafc" stroke-width="18" stroke-linecap="round">
    <path d="M200 170l80 80M280 170l-80 80" />
    <path d="M520 180l80 80M600 180l-80 80" />
  </g>
  <g fill="none" stroke="#c4a4f7" stroke-width="18">
    <circle cx="430" cy="280" r="42" />
    <circle cx="360" cy="400" r="42" />
  </g>
  <g fill="#e2e8f0" font-family="Outfit, sans-serif" font-size="36" font-weight="700">
    <text x="400" y="560" text-anchor="middle">Tic Tac Toe</text>
  </g>
</svg>